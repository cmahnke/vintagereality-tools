name: Build and Deploy Viewer

on:
  push:
    branches:
      - main
    paths:
      - 'viewer/**'
      - '.github/workflows/viewer.yml'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BASE_URL: vintagereality-tools
    defaults:
      run:
        working-directory: viewer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HF CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download model
        run: |
          mkdir -p ../weights
          hf download --local-dir ../weights cmahnke/vintagereality vintagereality-1.0.onnx
          
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./viewer/dist